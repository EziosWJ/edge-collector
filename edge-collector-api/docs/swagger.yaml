      menuName:
        type: string
      menuType:
        type: string
      parentId:
        type: integer
      path:
        type: string
      permissionCode:
        type: string
      sortOrder:
        type: integer
      visible:
        type: integer
    type: object
  auth.currentUserMenusResponseEnvelope:
