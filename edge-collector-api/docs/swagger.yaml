info:
  contact: {}
  description: Go backend migration platform API.
  title: Edge Collector API
  version: 0.1.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.loginResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponseEnvelope'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: 等待重试的秒数
              type: string
          schema:
            $ref: '#/definitions/internal_auth.errorResponseEnvelope'
      summary: 登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.emptyResponseEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponseEnvelope'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /api/auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.currentUserResponseEnvelope'
        "401":
