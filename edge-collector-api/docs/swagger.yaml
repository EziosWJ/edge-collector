info:
  contact: {}
  description: Go backend migration platform API.
  title: Edge Collector API
  version: 0.1.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.loginResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponseEnvelope'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: 等待重试的秒数
              type: string
          schema:
            $ref: '#/definitions/auth.errorResponseEnvelope'
      summary: 登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.emptyResponseEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponseEnvelope'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /api/auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.currentUserResponseEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponseEnvelope'
      security:
      - BearerAuth: []
      summary: 当前用户信息
      tags:
      - 认证
  /api/auth/menus:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.currentUserMenusResponseEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponseEnvelope'
      security:
      - BearerAuth: []
      summary: 当前用户可见菜单
      tags:
      - 认证
  /api/system/config:
    post:
      parameters:
      - description: 配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sysconfig.configRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sysconfig.ApiEnvelope'
      security:
      - BearerAuth: []
      summary: 新增配置
      tags:
      - 配置管理
  /api/system/config/{id}:
    delete:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sysconfig.ApiEnvelope'
      security:
      - BearerAuth: []
      summary: 删除配置
      tags:
      - 配置管理
    get:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sysconfig.ApiEnvelope'
      security:
      - BearerAuth: []
      summary: 配置详情
      tags:
      - 配置管理
    put:
      parameters:
      - description: 配置 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sysconfig.configRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sysconfig.ApiEnvelope'
      security:
      - BearerAuth: []
      summary: 修改配置
      tags:
      - 配置管理
  /api/system/config/{id}/status:
    patch:
      parameters:
