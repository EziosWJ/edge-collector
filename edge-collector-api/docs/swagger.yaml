      roleCode:
        type: string
      roleName:
        type: string
    type: object
  auth.emptyResponseEnvelope:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  auth.errorResponseEnvelope:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  auth.loginResponseEnvelope:
    properties:
      code:
        type: integer
      data:
