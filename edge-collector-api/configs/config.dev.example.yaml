# 开发环境配置模板。默认使用 PostgreSQL；也可按下方注释切换为 SQLite。
# 复制为 configs/config.dev.yaml 后填写本机数据库凭据（SQLite 不填凭据）与 JWT 密钥：
#   cp configs/config.dev.example.yaml configs/config.dev.yaml
# config.dev.yaml 已被 Git 忽略，不会提交。
swagger:
  enabled: true

database:
  # PostgreSQL is the default and preserves the existing development setup.
  driver: postgres
  url: postgres://127.0.0.1:5432/edge_collector?sslmode=disable
  username: change-me
  password: change-me

# SQLite 单实例开发配置（启用时替换上面的整个 database 节）：
# database:
#   driver: sqlite
#   url: /absolute/path/to/edge-collector-api/.data/edge-collector.db
#   # SQLite 不配置 username/password；应用会管理 WAL、外键和忙等待参数。

jwt:
  secret: replace-with-a-random-local-development-jwt-secret

auth:
  login_guard:
    # Set either max_attempts to 0 to disable that protection dimension.
    ip_max_attempts: 20
    username_max_attempts: 5

file:
  # 必须替换为当前机器上的绝对路径；本机开发建议放在项目根目录 .data/uploads。
  storage_root: /home/your-user/project/edge-collector/.data/uploads

log:
  level: debug
  format: text
