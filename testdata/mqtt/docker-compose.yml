services:
  broker:
    image: eclipse-mosquitto:2.0
    ports:
      - "127.0.0.1:${MQTT_E2E_BROKER_PORT:-18883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t edge-collector-e2e-health -n -q 0"]
      interval: 1s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MQTT_E2E_POSTGRES_DB:-edge_collector_mqtt_e2e}
      POSTGRES_USER: ${MQTT_E2E_POSTGRES_USER:-edge_collector}
      POSTGRES_PASSWORD: ${MQTT_E2E_POSTGRES_PASSWORD:-edge_collector_e2e_password}
    ports:
      - "127.0.0.1:${MQTT_E2E_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 2s
      retries: 20
