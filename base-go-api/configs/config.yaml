service:
  name: base-go-api

http:
  address: ":8099"
  trusted_proxies: []
  read_header_timeout: 10s
  read_timeout: 5m
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

swagger:
  enabled: false

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  max_age: 12h
  allow_credentials: false

database:
  driver: postgres
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

jwt:
  issuer: base-go-api
  audience: react-admin
  ttl: 2h

auth:
  login_guard:
    ip_window: 10m
    ip_max_attempts: 20
    username_window: 10m
    username_max_attempts: 5
    backoff_initial: 1s
    backoff_max: 30s
    lock_duration: 10m
    max_entries: 10000

log:
  level: info
  format: json
  add_source: false
