[project]
name = "modbus-simulator"
version = "0.1.0"
description = "Development Modbus device simulator for edge-collector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymodbus==3.15.0",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
modbus-simulator = "modbus_simulator:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
