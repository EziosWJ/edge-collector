name: Migrate from base-project-golang iot

on:
  push:
    paths:
      - .github/workflows/migrate-from-iot.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout source iot branch
        uses: actions/checkout@v4
        with:
          repository: EziosWJ/base-project-golang
          ref: iot
          path: source

      - name: Copy iot snapshot into target
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            source/ target/

      - name: Commit migrated snapshot
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore: migrate snapshot from base-project-golang iot'
          git push origin main
