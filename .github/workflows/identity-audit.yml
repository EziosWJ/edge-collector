name: Identity audit

on:
  push:
    paths:
      - .github/workflows/identity-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no active legacy identity references remain
        run: |
          set +e
          matches=$(git grep -nEi 'base-project-golang|base_project_golang|base-go-api|base_go_api|local_project|react-admin-template|智慧综合管理平台|base project|base go api' -- . ':(exclude).github/workflows/**' ':(exclude)docs/sqlite-arm64-test-deployment.md')
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "$matches"
            echo 'Legacy project identity references remain.'
            exit 1
          fi
          if [ $rc -ne 1 ]; then
            exit $rc
          fi
          echo 'No active legacy project identity references found.'
