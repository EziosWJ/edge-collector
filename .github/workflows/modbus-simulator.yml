name: Modbus simulator tests

on:
  push:
    paths:
      - "modbus-simulator/**"
      - ".github/workflows/modbus-simulator.yml"
  pull_request:
    paths:
      - "modbus-simulator/**"
      - ".github/workflows/modbus-simulator.yml"

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modbus-simulator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run simulator tests
        run: uv run python -m unittest discover -s tests -v
