name: Refresh Edge Collector context

on:
  push:
    paths:
      - .github/workflows/context-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh project context
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('CONTEXT.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '- **项目代号**: base-project-java 仓库',
              '- **项目代号**: Edge Collector'
          )
          text = text.replace(
              '- **项目定位**: React 管理后台 + Go REST API 后端（monorepo 单仓库），Java 参考后端已删除，接口统一在 `edge-collector-api/` 开发。',
              '- **项目定位**: 面向工业现场边缘设备的数据采集与协议接入项目；采用 monorepo，包含 React 管理后台与 Go 后端，业务代码统一在 `edge-collector-api/` 演进。'
          )
          text = text.replace(
              '### 当前后端 edge-collector（Go，唯一后端）',
              '### 当前后端 edge-collector-api（Go，唯一后端）'
          )
          text = text.replace(
              '- 形态: 模块化单体（Modular Monolith），只提供 REST API；不提前拆微服务。',
              '- 形态: 模块化单体（Modular Monolith）；当前已实现管理 REST API，后续在同一应用中增加现场采集、MQTT Client 与 Modbus Server 等已确认业务能力；不提前拆微服务。'
          )
          text = text.replace(
              '- 其他目标组件: 本地文件系统加 Docker Volume（文件服务与存储实现解耦）、Excelize、Docker 与 Docker Compose；不提前引入 Kubernetes、OpenTelemetry tracing、Redis 分布式锁或微服务治理基础设施。',
              '- 其他目标组件: 本地文件系统加 Docker Volume（文件服务与存储实现解耦）、Excelize、Docker 与 Docker Compose；不提前引入 Kubernetes、OpenTelemetry tracing、Redis 分布式锁或微服务治理基础设施。Edge Collector 已确认需要作为 MQTT Client 与上级 Broker 通信；这里“不提前引入 MQ”仅指不为内部架构预设 RocketMQ/Kafka 等消息队列基础设施，不限制 MQTT 业务接入。'
          )

          marker = '## 技术栈与演进状态\n'
          section = '''## Edge Collector 领域词汇（已确认）\n\n- **通信通道**：现场设备通信所使用的 RS485、TCP 或 UDP 通道。\n- **设备**：通过某个通信通道接入 Edge Collector 的现场工业设备。\n- **实时数据**：设备运行期间需要持续轮询采集并按上报要求发送的数据。\n- **告警状态**：需要持续轮询检查、用于判断设备是否产生新告警的状态。\n- **告警详情**：告警触发后，按照具体设备协议进一步查询得到并需要即时上报的信息。\n- **控制指令**：上级平台通过 MQTT 下发、要求 Edge Collector 对目标设备执行的操作。\n- **MQTT 上报**：Edge Collector 作为 MQTT Client 向上级 Broker 发送实时数据、告警、设备状态或控制结果。\n- **Modbus Server**：Edge Collector 面向其他设备或系统提供的 Modbus 数据服务，其对外地址不要求等同于现场设备原始寄存器地址。\n\n> 当前需求基线见 `docs/requirements/edge-collector-requirements.md`。设备 Driver、调度器、任务类型、缓存结构等尚未确认，不作为当前领域词汇预先写入。\n\n'''
          if '## Edge Collector 领域词汇（已确认）' not in text:
              text = text.replace(marker, section + marker)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit context refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTEXT.md
          git commit -m 'docs: refresh Edge Collector project context'
          git push origin main
