# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  APP_ENV: dev
  GOCACHE: '{{.ROOT_DIR}}/.task/go-build'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  db:migrate:
    desc: Apply schema and seed migrations
    dir: edge-collector-api
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:sqlite:
    desc: Apply SQLite schema and seed migrations using the SQLite profile
    dir: edge-collector-api
    env:
      APP_CONFIG_PROFILE: sqlite
    cmds:
      - go run ./cmd/migrate up --kind all

  db:backup:
    desc: Create an online SQLite backup; pass CLI flags through CLI_ARGS
    dir: edge-collector-api
    cmds:
      - go run ./cmd/backup {{.CLI_ARGS}}

  api:
    desc: Start the Go API
    dir: edge-collector-api
    cmds:
      - go run ./cmd/api

  api:sqlite:
    desc: Start the Go API with the SQLite profile
    dir: edge-collector-api
    env:
      APP_CONFIG_PROFILE: sqlite
    cmds:
      - go run ./cmd/api

  web:
    desc: Start the React development server
    dir: react-admin
    cmds:
      - npm run dev

  dev:
    desc: Migrate the database and start API and web together
    deps:
      - db:migrate
    cmds:
      - task --parallel api web

  dev:sqlite:
    desc: Migrate SQLite and start the SQLite API and web together
    deps:
      - db:migrate:sqlite
    cmds:
      - task --parallel api:sqlite web

  db:integration:postgres:
    desc: Run the PostgreSQL database integration contract
    dir: edge-collector-api
    cmds:
      - go test -tags=integration ./integration -run 'Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage' -count=1

  db:integration:sqlite:
    desc: Run the file-backed SQLite database integration contract
    dir: edge-collector-api
    cmds:
      - go test -tags=integration ./integration -run 'SQLite' -count=1

  db:check:
    desc: Run backend checks and both supported database integration contracts
    deps:
      - backend:check
      - db:integration:postgres
      - db:integration:sqlite

  backend:check:
    desc: Run backend tests and static checks
    deps:
      - test
    dir: edge-collector-api
    cmds:
      - go vet ./...

  frontend:lint:
    desc: Run frontend lint
    dir: react-admin
    cmds:
      - npm run lint

  frontend:build:
    desc: Build the frontend
    dir: react-admin
    cmds:
      - npm run build

  frontend:datetime-test:
    desc: Run the frontend datetime timezone regression test
    dir: react-admin
    cmds:
      - npm run test:datetime

  frontend:browser-test:
    desc: Run frontend browser regression tests
    dir: react-admin
    cmds:
      - npm run test:mqtt-config
      - npm run test:register-format
      - npm run test:realtime-null-state
      - npm run test:realtime-layout
      - npm run test:acquisition-config
      - npm run test:layout
      - npm run test:route-loading

  e2e:acquisition:
    desc: Run the SQLite, Go API, simulator and browser acquisition E2E
    dir: react-admin
    cmds:
      - npm run test:acquisition-e2e

  e2e:acquisition-script:
    desc: Run the SQLite, Go API, simulator and browser acquisition script E2E
    dir: react-admin
    cmds:
      - npm run test:acquisition-script-e2e

  e2e:znck-i:
    desc: Run the ZNCK-I RTU and TCP dynamic transaction E2E
    dir: react-admin
    cmds:
      - npm run test:znck-i-runtime-e2e

  simulator:test:
    desc: Validate the Modbus simulator fixture and run its protocol tests
    dir: modbus-simulator
    env:
      UV_CACHE_DIR: /tmp/edge-collector-uv-cache
    cmds:
      - uv sync --locked
      - uv run modbus-simulator --check-config --config config/simulator.yaml
      - uv run modbus-simulator --check-config --config config/adr0017-mqtt-e2e.yaml
      - uv run python -m unittest discover -s tests -v

  mqtt:e2e:sqlite:
    desc: Run ADR-0017 real Mosquitto + Modbus simulator E2E on SQLite (MQTT 5 and 3.1.1)
    cmds:
      - MQTT_E2E_REQUIRED=1 MQTT_E2E_DATABASE=sqlite MQTT_E2E_PROTOCOL=MQTT_5 node scripts/adr0017-mqtt-e2e.mjs
      - MQTT_E2E_REQUIRED=1 MQTT_E2E_DATABASE=sqlite MQTT_E2E_PROTOCOL=MQTT_3_1_1 node scripts/adr0017-mqtt-e2e.mjs

  mqtt:e2e:postgres:
    desc: Run ADR-0017 real Mosquitto + Modbus simulator E2E on PostgreSQL (MQTT 5 and 3.1.1)
    cmds:
      - MQTT_E2E_REQUIRED=1 MQTT_E2E_DATABASE=postgres MQTT_E2E_PROTOCOL=MQTT_5 node scripts/adr0017-mqtt-e2e.mjs
      - MQTT_E2E_REQUIRED=1 MQTT_E2E_DATABASE=postgres MQTT_E2E_PROTOCOL=MQTT_3_1_1 node scripts/adr0017-mqtt-e2e.mjs

  mqtt:integration:
    desc: Run the complete ADR-0017 real Broker + Modbus simulator matrix
    cmds:
      - task mqtt:e2e:sqlite
      - task mqtt:e2e:postgres

  check:
    desc: Run backend and frontend checks, including browser regressions
    deps:
      - backend:check
      - frontend:lint
      - frontend:build
      - frontend:browser-test

  test:
    desc: Run backend unit tests
    dir: edge-collector-api
    cmds:
      - go test ./...
